kind = "web"
previewPath = "/"
title = "REJOUICE® Clone"
version = "1.0.0"
id = "artifacts/rejouice-clone"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18481

[services.development]
run = "pnpm --filter @workspace/rejouice-clone run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rejouice-clone", "run", "build" ]
publicDir = "artifacts/rejouice-clone/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18481"
BASE_PATH = "/"
