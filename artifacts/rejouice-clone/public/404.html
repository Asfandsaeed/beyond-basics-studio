<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Beyond®</title>
  <script>
    // GitHub Pages SPA redirect — encodes the full path into a query param
    // so index.html can restore it via history.replaceState
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + '/' +
      '?p=' + encodeURIComponent(l.pathname + l.search) +
      (l.hash ? '&h=' + encodeURIComponent(l.hash) : '')
    );
  </script>
</head>
<body></body>
</html>
