name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (capture output for debugging)
        run: |
          pnpm --filter @workspace/rejouice-clone run build > /tmp/build.log 2>&1
          BUILD_EXIT=$?
          if [ $BUILD_EXIT -ne 0 ]; then
            echo "::error::BUILD FAILED (exit $BUILD_EXIT) — last 60 lines:"
            tail -60 /tmp/build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_EXIT
          fi
          cat /tmp/build.log
        env:
          PORT: "3000"
          BASE_PATH: "/"
          NODE_ENV: production

      - name: Add CNAME for custom domain
        run: echo "beyondbasics.studio" > artifacts/rejouice-clone/dist/public/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/rejouice-clone/dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
