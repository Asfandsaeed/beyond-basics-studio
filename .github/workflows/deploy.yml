name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add CNAME for custom domain
        run: echo "beyondbasics.studio" > artifacts/rejouice-clone/dist/public/CNAME

      - name: Upload pre-built dist to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/rejouice-clone/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
